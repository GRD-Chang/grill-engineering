name: CI

on:
  pull_request:
    branches:
      - main
      - "agent-run/**/run"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # 仅同一 PR 共用并发组，push 和手动运行按 run_id 隔离。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: changes
        if: github.event_name != 'workflow_dispatch' && (github.event_name == 'pull_request' || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'))
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: every
          filters: |
            all:
              - '**'
            code:
              - '**'
              - '!*.md'
              - '!docs/**/*.{md,html,png,jpg,jpeg,svg,gif,webp}'

      - name: Report lightweight validation
        if: steps.changes.outcome == 'success' && steps.changes.outputs.code == 'false'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.all_count }}
        run: |
          if [ "$CHANGED_FILES" = '0' ]; then
            echo '没有文件变更，跳过依赖安装、测试与类型检查。' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '仅文档或文档图片变更，跳过依赖安装、测试与类型检查。' >> "$GITHUB_STEP_SUMMARY"
          fi

  product-tests:
    needs: selection
    if: needs.selection.outputs.product == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap gcc

      - name: Prepare verified SQLite runtime
        run: python tests/support/prepare_sqlite.py --output-dir "$RUNNER_TEMP/agent-run-sqlite"

      - name: Install product and development tools
        run: make test-bootstrap

      - name: Test CI evidence rules
        id: rules
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s .github/ci -p 'test_*.py' -q

      - name: Smoke test installed CLI
        id: smoke
        run: agent-run --help

      - name: Run type checks
        id: types
        run: make typecheck

      - name: Verify independent checks
        if: always()
        env:
          RULES_RESULT: ${{ steps.rules.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          TYPE_RESULT: ${{ steps.types.outcome }}
        run: |
          test "$RULES_RESULT" = success
          test "$SMOKE_RESULT" = success
          test "$TYPE_RESULT" = success

      - name: Require native environment capabilities
        run: |
          mkdir -p .test-results
          python tests/support/report_environment.py --require-native > .test-results/native-capabilities.json

      - name: Run tests
        run: make test-report TEST_WORKERS=2 PYTEST_ARGS='-v'

      - name: Record complete test evidence
        run: python -B .github/ci/ci_evidence.py record --results .test-results

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics
          path: .test-results/
          include-hidden-files: true
          overwrite: true
          retention-days: 7

      - name: Remove SQLite test runtime
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/agent-run-sqlite" ]; then
            rm -r -- "$RUNNER_TEMP/agent-run-sqlite"
          fi

  quality:
    name: quality
    needs: [selection, product-tests]
    permissions:
      contents: read
      actions: read
    # 保留必需检查；本 job 只验证选择、作业结果及同候选完整证据。
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify selection
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
        run: test "$SELECTION_RESULT" = success

      - name: Download product test diagnostics
        if: needs.selection.outputs.product == 'true' && needs.product-tests.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-diagnostics
          path: ${{ runner.temp }}/test-diagnostics

      - name: Run tests
        env:
          PRODUCT_RESULT: ${{ needs.product-tests.result }}
          PRODUCT_SELECTED: ${{ needs.selection.outputs.product }}
          CHECKS_SELECTED: ${{ needs.selection.outputs.product == 'true' }}
        run: python3 -B .github/ci/ci_evidence.py verify --results "$RUNNER_TEMP/test-diagnostics"

      - name: Report CI costs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/ci/ci_costs.py --output "$RUNNER_TEMP/ci-costs"

      - name: Upload CI costs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-costs
          path: ${{ runner.temp }}/ci-costs/
          overwrite: true
          retention-days: 7
