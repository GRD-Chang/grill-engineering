name: CI

on:
  pull_request:
    branches:
      - main
      - "agent-run/**/run"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap

      - name: Install project and development tools
        run: python -m pip install ".[dev]"

      - name: Smoke test installed CLI
        run: agent-run --help

      - name: Run tests
        run: python -m pytest -q

      - name: Run type checks
        run: python -m mypy src/agent_run
