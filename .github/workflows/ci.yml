name: CI

on:
  pull_request:
    branches:
      - main
      - "agent-run/**/run"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    # Ubuntu 24.04 AppArmor blocks bwrap user namespaces on hosted runners.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap

      - name: Install project and development tools
        run: make test-bootstrap

      - name: Smoke test installed CLI
        run: agent-run --help

      - name: Run tests
        run: make test-report TEST_WORKERS=2

      - name: Run type checks
        run: python -m mypy src/agent_run

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics
          path: .test-results/
          include-hidden-files: true
          retention-days: 7
