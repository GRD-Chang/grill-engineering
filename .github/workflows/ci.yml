name: CI

on:
  pull_request:
    branches:
      - main
      - "agent-run/**/run"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    # Ubuntu 24.04 AppArmor blocks bwrap user namespaces on hosted runners.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect documentation-only changes
        id: changes
        if: github.event_name != 'workflow_dispatch' && (github.event_name == 'pull_request' || (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'))
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: every
          filters: |
            all:
              - '**'
            code:
              - '**'
              - '!*.md'
              - '!docs/**/*.{md,png,jpg,jpeg,svg,gif,webp}'

      - name: Report documentation-only skip
        if: steps.changes.outcome == 'success' && steps.changes.outputs.code == 'false' && steps.changes.outputs.all_count != '0'
        run: echo '仅文档或文档图片变更，跳过安装、测试与类型检查。' >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"

      - name: Install system dependencies
        if: steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap

      - name: Install project and development tools
        if: steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0'
        run: make test-bootstrap

      - name: Smoke test installed CLI
        if: steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0'
        run: agent-run --help

      - name: Run tests
        if: steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0'
        run: make test-report TEST_WORKERS=2

      - name: Run type checks
        if: steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0'
        run: python -m mypy src/agent_run

      - name: Upload test diagnostics
        if: always() && (steps.changes.outcome != 'success' || steps.changes.outputs.code != 'false' || steps.changes.outputs.all_count == '0')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-diagnostics
          path: .test-results/
          include-hidden-files: true
          retention-days: 7
